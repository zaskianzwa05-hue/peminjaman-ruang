<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Peminjaman Ruang Kampus</title>
</head>
<body>
    <h1>Sistem Peminjaman Ruang Kampus</h1>
        <p>Selamat datang di aplikasi peminjaman ruang.</p>
    <h2>Menu</h2>
    <ul>
        <li>Daftar Ruang</li>
        <li>Pengajuan Peminjaman</li>
        <li>Status Pengajuan</li>
    </ul>
    <h2>Form Pengajuan Peminjaman</h2>
<form>
    <label>Nama Mahasiswa</label>
        <input type="text" placeholder="Masukkan nama">
    <br><br>
    <label>Nama Ruang</label>
    <select>
        <option>Ruang 101</option>
        <option>Ruang 202</option>
        <option>Laboratorium 1</option>
    </select>
    <br><br>
    <label>Tanggal Peminjaman</label>
    <input type="date">
    <br><br>
        <buttotype="button">Ajukan Peminjaman</button>
</form>
</body>
</html>
