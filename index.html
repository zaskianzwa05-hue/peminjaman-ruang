<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Peminjaman Ruang Kampus</title>
</head>
<body>
    <h1>Sistem Peminjaman Ruang Kampus</h1>
        <p>Selamat datang di aplikasi peminjaman ruang.</p>
    <h2>Menu</h2>
    <ul>
        <li>Daftar Ruang</li>
        <li>Pengajuan Peminjaman</li>
        <li>Status Pengajuan</li>
    </ul>
    <h2>Form Pengajuan Peminjaman</h2>
<form>
    <label>Nama Mahasiswa</label>
        <input type="text" placeholder="Masukkan nama">
    <br><br>
    <form id="bookingForm">
    <label>Ruangan</label>
    <select id="room">
        <option value="A101">Ruangan A101</option>
        <option value="A102">Ruangan A102</option>
    </select>

    <label>Tanggal</label>
    <input type="date" id="date" required>

    <label>Jam Mulai</label>
    <input type="time" id="startTime" required>

    <label>Jam Selesai</label>
    <input type="time" id="endTime" required>

    <button type="submit">Ajukan Peminjaman</button>
</form>

<script src="schedule-validation.js"></script>
<script src="notification.js"></script>

</body>
</html>
